[package]
name = "mayhem-lens"
version = "0.1.0"
edition = "2024"
publish = false
description = "Overlay Windows de tiers d'augmentations ARAM Mayhem"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Graphics_Capture",
  "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Storage_Streams",
  "Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT",
  "Win32_System_WinRT_Graphics_Capture", "Win32_System_WinRT_Direct3D11",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Imaging",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi",
  "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_System_LibraryLoader",
  "Win32_UI_Shell", "Win32_Security", "Win32_System_Console"
] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
